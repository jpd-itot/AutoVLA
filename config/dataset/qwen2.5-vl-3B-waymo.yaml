name: qwen2.5-vl-3B-waymo
description: Preprocessing dataset for AutoVLA with Qwen 2.5 VL 3B model on Waymo E2E sample dataset
# mode (3Bモデルを指定)
pretrained_model_path: Qwen/Qwen2.5-VL-3B-Instruct-AWQ
# training
batch_size: 1
num_workers: 4
# dataset (コピーしたサンプルパスとvalスプリットを指定)
dataset_name: waymo
dataset_split: val
dataset_path: ./dataset/waymo_e2e/sample
# data frequency
raw_images_freq: 1
raw_trajectory_freq: 4
scene_frame_interval: 1
frame_shift: 0
# model history and future length
model_freq: 1
model_his_frames: 1
model_fut_frames: 0
# inference
inference_freq: 1
inference_his_frames: 1
